name: LUXE A07 scoped designs QA
on:
  pull_request:
  workflow_dispatch:
jobs:
  browser-design:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python scripts/a07-design-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a07-browser-evidence
          path: a07-evidence/

name: Fresh Fries LUXE static QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify A01 pinned baseline and traceability
        run: |
          git fetch --no-tags --depth=1 origin 57ab198888f259acad0a09d813eceb132a795eec f49085db1776c356611b8a072b8f33334c0a14bb
          python scripts/a01-baseline-qa.py
          git fetch --no-tags --depth=1 origin 65c533405a680b6020fe8f3c5ce8f1eac234847a
          python scripts/a01-p0-inventory-qa.py
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate frontend scripts, auth entry points and PWA icons
        run: node scripts/luxe-static-ci.mjs
      - name: Install browser test driver
        run: python -m pip install playwright==1.51.0
      - name: Verify burger picker interactions in real Chrome (FIX-02)
        run: python scripts/luxe-burger-picker-qa.py
      - name: Load base styles for drawer visual comparison
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:index.html" > "$RUNNER_TEMP/drawer-base.html"
          echo "DRAWER_BASELINE_HTML=$RUNNER_TEMP/drawer-base.html" >> "$GITHUB_ENV"
      - name: Verify mobile and desktop RTL navigation in Chrome
        run: python scripts/mobile-layout.py
      - name: Retain drawer comparison at phone and desktop widths
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: drawer-visual-comparison
          path: drawer-evidence/*.png
          if-no-files-found: warn
      - name: Retain P0 source inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a01-source-inventory
          path: a01-evidence/*.json
          if-no-files-found: error

name: LUXE A04 operational browser QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/luxe-burger-kitchen-20261123.js'
      - 'scripts/a04-browser-qa.py'
      - '.github/workflows/luxe-a04-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright==1.51.0
      - run: python scripts/a04-browser-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a04-operational-evidence
          path: a04-evidence/
          if-no-files-found: warn

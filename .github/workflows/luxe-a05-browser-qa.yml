name: LUXE A05 browser QA
on:
  pull_request:
    paths:
      - index.html
      - scripts/luxe-a05-branch-policy.js
      - scripts/a05-browser-qa.py
      - .github/workflows/luxe-a05-browser-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python scripts/a05-browser-qa.py

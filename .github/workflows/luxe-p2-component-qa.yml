name: LUXE P2 component cascade QA
on:
  pull_request:
    paths: ['index.html','styles/**','assets/*.css','scripts/p2-component-qa.py','scripts/luxe-a07-design.js','scripts/luxe-a07-elements.js','scripts/luxe-dashboard-studio.js','scripts/luxe-content-studio.js','.github/workflows/luxe-p2-component-qa.yml','docs/implementation/P2-css-consolidation-20261125.json']
  push:
    branches: [main]
    paths: ['scripts/p2-publish-probe.py','scripts/luxe-a07-design.js','scripts/luxe-a07-elements.js','scripts/luxe-dashboard-studio.js','styles/luxe-a07-design.css','styles/luxe-p2-components.css','docs/implementation/P2-css-consolidation-20261125.json','.github/workflows/luxe-p2-component-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.51.0 pillow==11.2.1
      - name: Install pinned Chromium for reproducible pixel comparisons
        run: python -m playwright install --with-deps chromium
      - name: Load pinned before tree
        run: |
          git fetch --no-tags --depth=1 origin c55c56e4b73f1aa3ae794eeff77c0598d97acc34
          mkdir -p "$RUNNER_TEMP/p2-baseline"
          git archive c55c56e4b73f1aa3ae794eeff77c0598d97acc34 | tar -x -C "$RUNNER_TEMP/p2-baseline"
          echo "P2_BASELINE=$RUNNER_TEMP/p2-baseline" >> "$GITHUB_ENV"
      - name: Re-run historical P2 parity against exact closed implementation
        run: |
          git fetch --no-tags --depth=1 origin 2a7a067a35f85e1a4c196d7e1f308cad305e583e
          mkdir -p "$RUNNER_TEMP/p2-closed"
          git archive 2a7a067a35f85e1a4c196d7e1f308cad305e583e | tar -x -C "$RUNNER_TEMP/p2-closed"
          status=0
          P2_ROOT="$RUNNER_TEMP/p2-closed" python scripts/p2-component-qa.py || status=$?
          mkdir -p p2-evidence/historical
          cp -a "$RUNNER_TEMP/p2-closed/p2-evidence/." p2-evidence/historical/ || true
          exit "$status"
      - name: Compare current editor against closed P2 default workspaces
        run: P2_CURRENT_CHROME=1 P2_BASELINE="$RUNNER_TEMP/p2-closed" P2_STEP04_REGRESSION=1 python scripts/p2-component-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-component-parity
          path: p2-evidence/
          if-no-files-found: warn
  published:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact public HTML, CSS and JavaScript bytes
        run: python scripts/p2-publish-probe.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-live-diagnostics
          path: p2-live-evidence/
          if-no-files-found: warn

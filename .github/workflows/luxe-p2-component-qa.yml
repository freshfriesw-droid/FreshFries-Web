name: LUXE P2 component cascade QA
on:
  pull_request:
    paths: ['index.html','styles/**','assets/*.css','scripts/p2-component-qa.py','.github/workflows/luxe-p2-component-qa.yml','docs/implementation/P2-css-consolidation-20261125.json']
  push:
    branches: [main]
    paths: ['scripts/p2-publish-probe.py','styles/luxe-p2-components.css','docs/implementation/P2-css-consolidation-20261125.json','.github/workflows/luxe-p2-component-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.51.0 pillow==11.2.1
      - name: Load pinned before tree
        run: |
          git fetch --no-tags --depth=1 origin c55c56e4b73f1aa3ae794eeff77c0598d97acc34
          mkdir -p "$RUNNER_TEMP/p2-baseline"
          git archive c55c56e4b73f1aa3ae794eeff77c0598d97acc34 | tar -x -C "$RUNNER_TEMP/p2-baseline"
          echo "P2_BASELINE=$RUNNER_TEMP/p2-baseline" >> "$GITHUB_ENV"
      - run: python scripts/p2-component-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-component-parity
          path: p2-evidence/
          if-no-files-found: warn
  published:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact public HTML and CSS bytes
        run: python scripts/p2-publish-probe.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-live-diagnostics
          path: p2-live-evidence/
          if-no-files-found: warn

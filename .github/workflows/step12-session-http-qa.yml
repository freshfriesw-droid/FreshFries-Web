name: STEP12 isolated session HTTP QA
on:
  pull_request:
    paths:
      - 'scripts/step12-session-http-qa.py'
      - 'supabase/migrations/*step12*session*.sql'
      - '.github/workflows/step12-session-http-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-session-http:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test signed session HTTP boundary in disposable PostgREST
        run: python3 scripts/step12-session-http-qa.py

name: LUXE A02 customer UI QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/luxe-customer-otp-qa.py'
      - '.github/workflows/luxe-a02-customer-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  customer-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned browser driver
        run: python -m pip install playwright==1.51.0
      - name: Run customer portal browser regression
        run: python scripts/luxe-customer-otp-qa.py

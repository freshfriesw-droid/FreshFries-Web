name: LUXE A06 navigation QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python scripts/a06-navigation-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: A06-navigation-and-cascade
          path: a06-evidence/

name: LUXE A09 denial HTTP QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgrest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify denied RPC status and durable audit through real HTTP
        run: python3 scripts/a09-denial-http-qa.py

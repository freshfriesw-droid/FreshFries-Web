name: LUXE A05 employee Edge QA
on:
  pull_request:
    paths:
      - 'supabase/functions/ff61-employees/**'
      - 'scripts/a05-edge-qa.mjs'
      - '.github/workflows/luxe-a05-edge-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/a05-edge-qa.mjs

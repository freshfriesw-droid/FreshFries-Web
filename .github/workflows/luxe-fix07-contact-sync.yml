name: LUXE FIX-07 contact synchronization QA
on:
  pull_request:
    paths:
      - 'scripts/luxe-order-customer-edit-20261123.js'
      - 'scripts/luxe-fix07-contact-sync-qa.py'
      - '.github/workflows/luxe-fix07-contact-sync.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contact-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install playwright==1.51.0
      - run: python scripts/luxe-fix07-contact-sync-qa.py

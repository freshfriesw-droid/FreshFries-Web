name: LUXE A08 dashboard QA
on:
  pull_request:
  workflow_dispatch:
jobs:
  browser-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.51.0
      - run: python scripts/a08-dashboard-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a08-browser-evidence
          path: a08-evidence/

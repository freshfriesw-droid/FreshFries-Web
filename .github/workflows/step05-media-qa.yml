name: STEP05 media resilience QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/step05-media-qa.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.51.0
      - run: python scripts/step05-media-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step05-media-evidence
          path: step05-evidence/

name: STEP12 client session generation QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/step12-client-session-qa.cjs'
      - '.github/workflows/step12-client-session-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  client-session:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/step12-client-session-qa.cjs

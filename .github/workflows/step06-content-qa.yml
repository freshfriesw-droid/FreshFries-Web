name: STEP06 content registry QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.51.0
      - run: python scripts/step06-content-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: step06-content-evidence
          path: step06-evidence/
